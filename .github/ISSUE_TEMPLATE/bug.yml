name: Bug
description: Something in deslop doesn't work
labels: [bug]
body:
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - npx github:cdrcthv/deslop
        - npx skills add
        - Claude Code plugin
        - deslop.skill file
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: AI tool and version
      placeholder: Claude Code 2.1, Cursor, Copilot in VS Code...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Node version
      placeholder: Windows 11, Node 22
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Paste the command and its output if there is any.
    validations:
      required: true
